{% extends "base.html" %}
{% block title %}{{ heading }} — {{ product }}{% endblock %}

{% block content %}
<div class="wrap-sm">
  <h1>{{ heading }}</h1>
  <p>{{ text }}</p>
  {% if link %}
  <a class="btn btn-primary" href="{{ link }}">{{ link_text|default(t('info.continue')) }}</a>
  {% elif user %}
  <a class="btn btn-primary" href="{{ path_for('app') }}">{{ t('info.to_app') }}</a>
  {% else %}
  <a class="btn btn-primary" href="{{ path_for('login') }}">{{ t('info.to_login') }}</a>
  {% endif %}
</div>
{% endblock %}
