{% extends "base.html" %}
{% block title %}{{ heading }} — {{ product }}{% endblock %}

{% block content %}
<div class="wrap-sm">
  <h1>{{ heading }}</h1>
  <p>{{ text }}</p>
  {% if link %}
  <a class="btn btn-primary" href="{{ link }}">{{ link_text|default('Weiter') }}</a>
  {% elif user %}
  <a class="btn btn-primary" href="/app">Zur Übersicht</a>
  {% else %}
  <a class="btn btn-primary" href="/anmelden">Zur Anmeldung</a>
  {% endif %}
</div>
{% endblock %}
